name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

# Cancel superseded runs on the same branch or PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Backend tests
        run: docker compose --profile tools run --rm --build backend-test
      - name: Cleanup
        if: always()
        run: docker compose --profile tools down

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Frontend tests
        run: docker compose --profile tools run --rm --build nextjs-test
      - name: Frontend lint
        run: docker compose --profile tools run --rm --build nextjs-lint
      - name: Cleanup
        if: always()
        run: docker compose --profile tools down

  build-scan-push:
    needs: [secrets-scan, backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false          # Failing backend scan won't hide frontend findings
      matrix:
        service: [backend, frontend]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -f ${{ matrix.service }}/Dockerfile -t ${{ matrix.service }}-check ./${{ matrix.service }}

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.service }}-check
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      # Only for pushes and merges to main
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push the scanned image
        if: github.event_name == 'push'
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/url-shortener-${SERVICE}"
          tags=("${GITHUB_SHA::7}")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=("${GITHUB_REF_NAME#v}")   # v1.2.3 -> 1.2.3
          else
            tags+=("latest")
          fi
          for t in "${tags[@]}"; do
            docker tag "${SERVICE}-check" "${image}:${t}"
            docker push "${image}:${t}"
            echo "Pushed ${image}:${t}" >> "$GITHUB_STEP_SUMMARY"
          done
